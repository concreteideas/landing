<!DOCTYPE html>
<html lang="en" data-root="../" data-page="products">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore Concrete Ideas' handcrafted architectural concrete collection." />
    <title>Products | Concrete Ideas</title>
    <link rel="stylesheet" href="../css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/products.css" />
  </head>
  <body>
    <div data-site-header></div>
    <main class="catalog-main">
      <section class="catalog-hero">
        <div class="container">
          <p class="site-eyebrow">Concrete Ideas collection</p>
          <h1>Material objects for lasting spaces.</h1>
          <p>Handcrafted concrete pieces for landscape, interior, and project-specific applications.</p>
        </div>
      </section>
      <div class="container">
        <nav class="site-breadcrumbs" aria-label="Breadcrumb">
          <a href="../index.html">Home</a>
          <span>/</span>
          <span>Products</span>
        </nav>
        <section class="catalog-controls" aria-label="Product controls">
          <label class="search-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span class="visually-hidden">Search products</span>
            <input data-product-search type="search" placeholder="Search the collection" />
          </label>
          <div class="filter-list" data-product-filters>
            <button class="is-active" data-category="All">All</button>
            <button data-category="Landscape">Landscape</button>
            <button data-category="Indoor">Indoor</button>
          </div>
        </section>
        <p class="catalog-meta" data-product-count>Loading collection...</p>
        <section class="products-grid mt-3" data-products-grid aria-live="polite"></section>
      </div>
    </main>
    <div data-site-footer></div>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/products.js"></script>
  </body>
</html>
