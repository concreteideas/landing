<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concrete Ideas — Order Review</title>
  <style>
    :root{--ink:#292623;--muted:#756f69;--line:#ded8d1;--warm:#f6f3ef;--paper:#fff;--accent:#8b3427;--green:#466b50;--soft:#eee9e2}
    *{box-sizing:border-box} body{margin:0;background:var(--warm);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:13px}
    header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between;position:sticky;top:0;z-index:5}
    .brand{letter-spacing:3px;font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.5px;margin-top:4px}
    .wrap{max-width:1280px;margin:0 auto;padding:24px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);padding:14px 18px;min-width:150px}.stat b{display:block;font-size:22px;margin-top:4px}.stat span{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
    .grid{display:grid;grid-template-columns:370px 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line)}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:center}.search{border:1px solid #ccc5bd;padding:9px;width:100%;font-size:12px}.list{max-height:calc(100vh - 260px);overflow:auto}.order{padding:15px 17px;border-bottom:1px solid #eee9e4;cursor:pointer}.order:hover,.order.active{background:#f7f4f0}.order.active{border-left:3px solid var(--accent);padding-left:14px}.oid{font-weight:700;font-size:11px;letter-spacing:.6px}.name{font-size:14px;margin:5px 0}.meta{color:var(--muted);font-size:11px;line-height:1.5}.badge{display:inline-block;border:1px solid #cdbfb7;border-radius:999px;padding:3px 7px;font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-top:8px}.content{padding:22px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}h2{margin:0 0 5px;font-size:25px}h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin:26px 0 10px}.customer{display:grid;grid-template-columns:1fr 1fr;gap:8px 25px;color:#4e4944}.customer div{padding:8px 0;border-bottom:1px solid #eee9e4}.items{width:100%;border-collapse:collapse}.items th,.items td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee9e4}.items th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.items td:last-child,.items th:last-child{text-align:right}.total{text-align:right;font-size:19px;margin-top:16px}.actions{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.btn{border:0;padding:12px 18px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.link{color:var(--accent);text-decoration:none;font-size:11px}.message{margin-top:15px;padding:12px;background:var(--soft);display:none}.message.show{display:block}.loading{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:380px}.customer{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="brand">CONCRETE IDEAS<small>ORDER REVIEW</small></div><div id="refreshLabel" style="color:#756f69;font-size:11px">Loading…</div></header>
<div class="wrap">
  <div class="stats"><div class="stat"><span>Quote Sent</span><b id="quoteSentCount">—</b></div><div class="stat"><span>Payment Done</span><b id="paidCount">—</b></div><div class="stat"><span>New</span><b id="newCount">—</b></div><div class="stat"><span>Total Orders</span><b id="totalCount">—</b></div></div>
  <div class="grid">
    <section class="panel"><div class="panel-head">Orders awaiting payment</div><div style="padding:12px"><input id="search" class="search" placeholder="Search order, customer or project…"></div><div id="orderList" class="list"><div class="loading">Loading orders…</div></div></section>
    <section class="panel"><div id="detail" class="empty">Select a Quote Sent order to review it.</div></section>
  </div>
</div>
<script>
let orders=[];let selected=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){google.script.run.withSuccessHandler(data=>{orders=data||[];renderList();updateStats();document.getElementById('refreshLabel').textContent='Updated '+new Date().toLocaleTimeString();}).withFailureHandler(showError).getAllOrders();}
function updateStats(){document.getElementById('quoteSentCount').textContent=orders.filter(o=>o.status.toLowerCase()==='quote sent').length;document.getElementById('paidCount').textContent=orders.filter(o=>o.status.toLowerCase()==='payment done').length;document.getElementById('newCount').textContent=orders.filter(o=>o.status.toLowerCase()==='new').length;document.getElementById('totalCount').textContent=orders.length;}
function renderList(){const q=document.getElementById('search').value.toLowerCase();const list=orders.filter(o=>o.status.toLowerCase()==='quote sent' && [o.orderId,o.name,o.company,o.project].join(' ').toLowerCase().includes(q));document.getElementById('orderList').innerHTML=list.length?list.map(o=>`<div class="order ${selected===o.orderId?'active':''}" onclick="selectOrder('${o.orderId}')"><div class="oid">${esc(o.orderId)}</div><div class="name">${esc(o.name||'—')}</div><div class="meta">${esc(o.company||'')}<br>${esc(o.project||'')}<br>${money(o.orderTotal)}</div><span class="badge">Quote Sent</span></div>`).join(''):'<div class="empty">No Quote Sent orders awaiting payment.</div>';}
function selectOrder(id){selected=id;const o=orders.find(x=>x.orderId===id);if(!o)return;renderList();renderDetail(o);}
function renderDetail(o){document.getElementById('detail').innerHTML=`<div class="content"><div class="oid">${esc(o.orderId)}</div><h2>${esc(o.name||'Customer')}</h2><div class="meta">${esc(o.company||'')} · ${esc(o.project||'')}</div><h3>Customer</h3><div class="customer"><div><b>Email</b><br>${esc(o.email)}</div><div><b>Phone</b><br>${esc(o.phone)}</div><div><b>Delivery</b><br>${esc(o.location)}</div><div><b>Order date</b><br>${new Date(o.createdAt).toLocaleString()}</div></div><h3>Order items</h3><table class="items"><thead><tr><th>Product</th><th>Size</th><th>Qty</th><th>Rate</th><th>Value</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.product)}</td><td>${esc(i.size)}</td><td>${i.quantity}</td><td>${money(i.rate)}</td><td>${money(i.lineValue)}</td></tr>`).join('')}</tbody></table><div class="total">Products ${money(o.productValue)}<br><span style="font-size:13px;color:#756f69">Shipment (5%) ${money(o.shipment)}</span><br><b>${money(o.orderTotal)}</b></div>${o.quotePdfUrl?`<p><a class="link" href="${esc(o.quotePdfUrl)}" target="_blank">View quotation PDF →</a></p>`:''}<div class="actions"><div style="font-size:11px;color:#756f69">Verify the customer's payment before confirming.</div><button class="btn primary" onclick="markPaid('${o.orderId}')">Mark Payment done</button></div><div id="msg" class="message"></div></div>`;}
function markPaid(id){const btn=document.querySelector('.btn.primary');if(btn)btn.disabled=true;const msg=document.getElementById('msg');if(msg){msg.className='message show';msg.textContent='Confirming payment, generating bill and notifying manufacturing…';}google.script.run.withSuccessHandler(res=>{if(msg){msg.textContent='Payment confirmed. Bill sent to customer and manufacturing order created.';}load();setTimeout(()=>{const o=orders.find(x=>x.orderId===id);if(o){selected=id;renderDetail(o);}},700);}).withFailureHandler(err=>{if(btn)btn.disabled=false;showError(err);if(msg){msg.textContent='Payment confirmation failed: '+(err.message||err);}}).markPaymentDone(id);}
function showError(err){document.getElementById('detail').innerHTML='<div class="empty">Error: '+esc(err&&err.message?err.message:err)+'</div>';}
document.getElementById('search').addEventListener('input',renderList);load();
</script>
</body>
</html>
